[project]
name = "vr-feedback"
version = "0.1.0"
description = "Text-side helpers for voice-roleplay: TTS segmenting, metrics, prompts, LLM client, feedback"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vr_feedback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a running llama-server on 127.0.0.1:8713 (VR_LLM_URL overrides)",
]
