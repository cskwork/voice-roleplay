[project]
name = "vr-tts-worker"
version = "0.1.0"
description = "Local TTS worker (Fun-CosyVoice3-0.5B-2512) for voice-roleplay"
requires-python = "==3.10.*"
# Inference subset of vendor/CosyVoice/requirements.txt (commit 074ca6dc), same pins where kept.
# Dropped: CUDA-only (deepspeed, tensorrt-*, onnxruntime-gpu), UI/training-only (gradio, tensorboard,
# grpcio*, fastapi-cli), and wetext (its Normalizer downloads FSTs from ModelScope at
# construction time; the worker does its own English normalization instead). fastapi/uvicorn/pydantic are newer than upstream for the worker API.
dependencies = [
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "gdown==5.1.0",  # imported (unused) by matcha.utils
    "hydra-core==1.3.2",
    "HyperPyYAML==1.2.3",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "matplotlib==3.7.5",
    "modelscope==1.20.0",
    "networkx==3.1",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "onnx==1.16.0",
    "onnxruntime==1.18.0",
    "openai-whisper==20231117",
    "protobuf==4.25",
    "pyarrow==18.1.0",
    "pyworld==0.3.4",
    "rich==13.7.1",
    "soundfile==0.12.1",
    "torch==2.3.1",
    "torchaudio==2.3.1",
    "transformers==4.51.3",
    "x-transformers==2.11.24",
    "wget==3.2",  # imported (unused) by matcha.utils
    "fastapi==0.115.6",
    "uvicorn==0.30.0",
    "wsproto>=1.2",  # uvicorn 0.30 supports WS denial responses (HTTP 401) only with wsproto
    "pydantic>=2.7,<3",
    # lightning 2.2 / matcha import pkg_resources at runtime (removed in setuptools>=81)
    "setuptools<81",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "websockets>=12",
    "psutil>=5.9",
]

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
# openai-whisper 20231117 setup.py imports pkg_resources (removed in setuptools>=81)
openai-whisper = ["setuptools<81"]

[tool.pytest.ini_options]
testpaths = ["tests"]
