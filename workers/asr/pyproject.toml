[project]
name = "vr-asr-worker"
version = "0.1.0"
description = "Local ASR worker (Qwen3-ASR-0.6B) for voice-roleplay"
requires-python = "==3.12.*"
dependencies = [
    "qwen-asr==0.0.6",
    "torch>=2.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "websockets>=13",
    "psutil",
    "jiwer",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["model: needs the real Qwen3-ASR model (slow)"]
