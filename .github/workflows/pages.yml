# Builds the landing page (site/) and deploys it to GitHub Pages.
# The launch video, posters and architecture diagram are copied in at build time so they are not duplicated in git.
# One-time repo setting: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - marketing/launch-video/out/**
      - docs/architecture/system.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site
          cp -R site _site
          mkdir -p _site/media
          cp marketing/launch-video/out/*.mp4 marketing/launch-video/out/poster*.png _site/media/
          cp docs/architecture/system.png _site/media/

      - name: Check local links
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          root = Path("_site")
          html = (root / "index.html").read_text(encoding="utf-8")
          refs = set(re.findall(r'(?:src|href|poster)="([^"#?]+)"', html))
          missing = [r for r in sorted(refs) if not re.match(r"^(https?:|mailto:|data:)", r) and r != "./" and not (root / r).exists()]
          if missing:
              sys.exit("missing files in _site: " + ", ".join(missing))
          print(f"{len(refs)} references checked")
          PY

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
