[project]
name = "vr-gateway"
version = "0.1.0"
description = "Local gateway for the voice-roleplay English speaking practice service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "soxr>=0.4",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "vr-feedback",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[tool.uv.sources]
vr-feedback = { path = "../../workers/feedback", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vr_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 60
